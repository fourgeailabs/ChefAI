name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Restore Keystore from base64
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring exact debug keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "debug.keystore.base64 not found, proceeding with default generation if applicable."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/ChefAI-Studio-v1.02.00-debug.apk || cp app/build/outputs/apk/debug/*.apk build-artifacts/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChefAI-Studio-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            build-artifacts/*.apk

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/*.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
